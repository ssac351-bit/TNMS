<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="shortcut icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a4635" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TCSMS" />
    <meta name="apple-mobile-web-app-title" content="TCSMS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>তানজিল মাইক্রোক্রেডিট সফটওয়্যার (TCSMS)</title>
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
      });
      window.addEventListener('appinstalled', function() {
        try {
          localStorage.setItem('tcsms_pwa_installed', 'true');
          localStorage.setItem('pwa_installed_mode', 'true');
        } catch (err) {}
        window.deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa_app_installed'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
